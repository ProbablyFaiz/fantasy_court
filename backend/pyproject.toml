[project]
name = "fantasy-court"
version = "0.1.0"
authors = [
    { name = "Faiz Surani", email = "faiz@faizsurani.com" },
]
description = "Fantasy Court - A fantasy sports league management system"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = "~=3.11.10"
dependencies = [
    "fastapi[standard]>=0.114.2",
    "pydantic>=2.9.1",
    "rl",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.2",
    "gunicorn>=23.0.0",
    "boto3>=1.38.41",
    "celery>=5.5.3",
    "redis>=6.2.0",
    "alembic-utils>=0.8.8",
    "structlog>=25.4.0",
    "sentry-sdk[celery,fastapi,sqlalchemy]>=2.30.0",
    "beautifulsoup4>=4.14.2",
    "lxml>=6.0.2",
    "openai>=2.5.0",
    "pydub>=0.25.1",
    "anthropic>=0.71.0",
    "assemblyai>=1.5.5",
    "jinja2>=3.1.6",
    "smartypants>=2.0.1",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "ipykernel>=7.0.1",
    "ipython>=8.27.0",
    "pgcli>=4.3.0",
    "prek>=0.3.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-postgresql>=7.0.2",
    "ruff>=0.14.4",
    "ty>=0.0.34",
]

[tool.uv.sources]
rl = { git = "https://github.com/ProbablyFaiz/rl.git" }

[project.urls]
homepage = "https://github.com/ProbablyFaiz/fantasy_court"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["court"]

[project.scripts]
court = "court.cli.main:cli"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["B", "E", "I", "N", "PTH", "COM", "C4", "UP"]
extend-ignore = ["COM812", "E712", "E501", "B904", "N805"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.ty.rules]
possibly-missing-attribute = "ignore"
# Pre-existing violations, downgraded so CI passes. Promote back to "error" as they are fixed.
invalid-argument-type = "warn"
unresolved-attribute = "warn"
invalid-type-form = "warn"
not-subscriptable = "warn"
invalid-assignment = "warn"
unsupported-operator = "warn"
invalid-await = "warn"
no-matching-overload = "warn"
invalid-return-type = "warn"

[tool.ty.src]
exclude = ["test/**", "court/db/migrations/versions/**", "court/experiments/**"]
