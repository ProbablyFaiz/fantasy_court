services:
  celery:
    container_name: fantasy-court-celery
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "court.jobs.celery:celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    volumes:
      - fantasy_court_data:/data
    networks:
      - default
      - infra
    environment:
      - DATA_ROOT=/data
      - RL_DEBUG=0
      - FANTASY_COURT_ENV=prod
      - TZ=America/Los_Angeles
    env_file:
      - prod.env
    restart: unless-stopped

  celery-beat:
    container_name: fantasy-court-celery-beat
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "court.jobs.celery:celery_app", "beat", "--loglevel=info"]
    volumes:
      - fantasy_court_data:/data
    networks:
      - default
      - infra
    environment:
      - DATA_ROOT=/data
      - RL_DEBUG=0
      - FANTASY_COURT_ENV=prod
      - TZ=America/Los_Angeles
    env_file:
      - prod.env
    restart: unless-stopped

networks:
  # Shared with db_services. Owned by that stack (created with
  # `docker network create infra`); referenced here as external so
  # `docker compose down` won't try to delete it. Postgres and Redis are
  # reachable on it as `postgres` and `redis`.
  infra:
    external: true
    name: infra

volumes:
  fantasy_court_data:
    driver: local
