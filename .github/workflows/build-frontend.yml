name: Build Frontend

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend-static/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend-static && pnpm install --frozen-lockfile

      - name: Create placeholder data files
        run: |
          mkdir -p frontend-static/public/data/opinions
          echo '[]' > frontend-static/public/data/index.json

      - name: Typecheck
        run: cd frontend-static && pnpm typecheck

      - name: Build
        run: cd frontend-static && pnpm run build
